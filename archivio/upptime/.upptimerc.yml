# Uppo public status — powered by Upptime (https://upptime.js.org)
owner: uppo-helpdesk
repo: uppo-status

sites:
  - name: App Uppo — app.uppo.io
    slug: app
    url: https://app.uppo.io
  - name: API Uppo — api.uppo.io
    slug: api
    url: https://api.uppo.io/api/v2/public/status
    expectedStatusCodes:
      - 200
  - name: Self-Service Portal — uppohelpdesk.portal.uppo.io
    slug: portal-uppo
    url: https://uppohelpdesk.portal.uppo.io
  - name: SSO Uppo — sso.uppo.io
    slug: sso
    url: https://sso.uppo.io/realms/Uppo
    expectedStatusCodes:
      - 200

# Cadenza dei controlli.
#
# Il predefinito di Upptime e' `*/5 * * * *`: 288 esecuzioni al giorno, ~8.600
# al mese. Fra checkout, azione e commit ognuna costa piu' di un minuto, e nel
# 2026 questo repository e' arrivato a consumare 73.722 minuti di Actions —
# piu' di uppo-backend. A settembre l'organizzazione ha superato il pacchetto
# incluso (52.421 minuti, per la prima volta a pagamento) e GitHub ha iniziato
# a bloccare le esecuzioni: da almeno il 21/09 ogni avvio di Uptime CI torna
# `action_required`, anche quello manuale.
#
# Il monitor si e' quindi spento da solo, e la pagina di stato ha continuato a
# dichiarare tutti i servizi «Up» con tempo di risposta 0ms — cioe' avrebbe
# mentito durante un guasto vero.
#
# Ogni 15 minuti: tre volte meno consumo (~11.500 minuti al mese), e per una
# pagina di stato pubblica resta una finestra di rilevazione sensata.
#
# Questo blocco NON e' decorativo: `update-template` rigenera i workflow da
# questo file ogni notte. Cambiare solo `.github/workflows/uptime.yml`
# verrebbe annullato entro 24 ore.
workflowSchedule:
  uptime: "*/15 * * * *"

status-website:
  cname: status.uppo.io
  name: Uppo Status
  logoUrl: https://uppo.portal.uppo.io/uppo-logo.svg
  favicon: https://app.uppo.io/favicon.ico
  introTitle: "**Uppo Service Status**"
  introMessage: "Real-time monitoring of Uppo services — application, API, self-service portal and single sign-on (SSO). Updated automatically every 5 minutes."
  navbar:
    - title: Status
      href: /
    - title: Uppo
      href: https://uppo.io
